[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rashomon-tableau-conan"
version = "0.1.0"
description = "Perspective-aware contradiction reasoning PoC on the Conan detective narrative benchmark"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
