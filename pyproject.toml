[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# Distribution name is retained for backward compatibility with existing CI and artifacts.
name = "openrca-missing-relation"
version = "0.1.0"
description = "Telemetry-grounded structural relation recovery and incident-specific causal reasoning for OpenRCA 2.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
]

[project.optional-dependencies]
nli = [
  "torch>=2.2",
  "transformers>=4.50,<5",
  "sentencepiece>=0.2",
]
# pslpython 2.4.0 currently pins JPype1 1.4.0. That stack is verified in this
# repository on CPython 3.10 + Java 17; JPype1 1.4.0 does not build on 3.11.
psl = ["pslpython>=2.3,<2.5; python_version < '3.11'"]
llm = ["openai>=1.100"]
test = ["pytest>=8.0"]
all = [
  "torch>=2.2",
  "transformers>=4.50,<5",
  "sentencepiece>=0.2",
  "pslpython>=2.3,<2.5; python_version < '3.11'",
  "openai>=1.100",
  "pytest>=8.0",
]

[project.scripts]
# Historical command retained; it executes Stage-2 incident causal qualification.
openrca-mr = "openrca_mr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
