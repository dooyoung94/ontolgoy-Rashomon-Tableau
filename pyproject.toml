[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rashomon-tableau"
version = "0.2.0"
description = "Provenance-aware logical conflict localization and truth resolution from conflicting sources"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
