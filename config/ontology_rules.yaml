# Relation names are normalized from Conan labels by conan_loader.py.

symmetric:
  - same_person_as_x_different_identity
  - acquaintance_of_x
  - friend_of_x
  - lover_of_x

inverse:
  parent_of_x: child_of_x
  child_of_x: parent_of_x
  host_of_x: guest_of_x
  guest_of_x: host_of_x
  teacher_of_x: student_of_x
  student_of_x: teacher_of_x
  employer_of_x: employee_of_x
  employee_of_x: employer_of_x
  husband_of_x: wife_of_x
  wife_of_x: husband_of_x
  messenger_of_x: customer_of_x
  customer_of_x: messenger_of_x

hierarchy:
  father_of_x:
    - parent_of_x
  mother_of_x:
    - parent_of_x
  son_of_x:
    - child_of_x
  daughter_of_x:
    - child_of_x
  husband_of_x:
    - spouse_of_x
  wife_of_x:
    - spouse_of_x
  boyfriend_of_x:
    - lover_of_x
  girlfriend_of_x:
    - lover_of_x

incompatible:
  - [parent_of_x, child_of_x]
  - [father_of_x, son_of_x]
  - [father_of_x, daughter_of_x]
  - [mother_of_x, son_of_x]
  - [mother_of_x, daughter_of_x]

exclusive: []
