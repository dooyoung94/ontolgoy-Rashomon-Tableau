# Conservative relation semantics for WN18RR multi-hop completion.
# These rules are independent of benchmark labels and are used only by Tableau.

symmetric:
  - _similar_to
  - _derivationally_related_form
  - _verb_group
  - _also_see

inverse: {}

hierarchy: {}

# Hypernym chains are the primary logical multi-hop structure used in the first study.
transitive:
  - _hypernym

# A strict hypernym relation cannot point to itself and cannot hold in both directions
# for two distinct synsets. These constraints make Tableau filtering measurable rather
# than merely re-ranking the same neural candidates.
irreflexive:
  - _hypernym
  - _instance_hypernym

antisymmetric:
  - _hypernym

incompatible: []
exclusive: []

composition:
  # instance(x, y) and hypernym(y, z) -> instance(x, z)
  - left: _instance_hypernym
    right: _hypernym
    result: _instance_hypernym
