# MAGIC paired method-effect matrix.
# Goal: measure the effect of Rashomon Worlds *within the same base model*.
# Gold original_triplet / perturb_triplet fields are evaluation-only.

attempts_per_example: 3
conditions:
  - magic_direct
  - compute_matched_direct
  - rashomon_worlds_llm_scorer
  - rashomon_worlds_deberta_scorer

discriminative_scorer:
  key: deberta_v3_nli
  model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  role: world_scorer_only
  note: "NLI discriminator; never used as a generative claim extractor."

model_sets:
  current_available:
    - gpt_5_5
    - gpt_5_4_mini
    - claude_sonnet_5
    - mistral_small_4
    - llama_3_3_70b

  # Single-token Hugging Face Inference Providers track. Provider is pinned in the model id.
  hf_open_llms:
    - hf_gpt_oss_120b
    - hf_qwen3_235b
    - hf_deepseek_r1_0528

  historical_magic_peers:
    - mixtral_8x7b
    - llama_3_1_70b
    - claude_3_5_haiku
    - gpt_4o_mini
    - o1

models:
  hf_gpt_oss_120b:
    display_name: GPT-OSS 120B (HF)
    historical_magic_peer: false
    exact_model: openai/gpt-oss-120b:novita
    execution: huggingface_router
    api_key_env: HF_TOKEN
    availability_note: "Open-weight model through Hugging Face Inference Providers; provider pinned to Novita for HF pay-as-you-go compatibility."

  hf_qwen3_235b:
    display_name: Qwen3 235B A22B Instruct 2507 (HF)
    historical_magic_peer: false
    exact_model: Qwen/Qwen3-235B-A22B-Instruct-2507:novita
    execution: huggingface_router
    api_key_env: HF_TOKEN
    availability_note: "Open-weight Qwen3 MoE through Hugging Face router; provider pinned to Novita."

  hf_deepseek_r1_0528:
    display_name: DeepSeek-R1-0528 (HF)
    historical_magic_peer: false
    exact_model: deepseek-ai/DeepSeek-R1-0528:novita
    execution: huggingface_router
    api_key_env: HF_TOKEN
    availability_note: "Open-weight reasoning model through Hugging Face router; provider pinned to Novita."

  gpt_5_5:
    display_name: GPT-5.5
    historical_magic_peer: false
    exact_model: gpt-5.5
    execution: openai
    model_env: GPT55_MODEL
    api_key_env: OPENAI_API_KEY
    availability_note: "Current OpenAI frontier model. Record the accepted API model identifier and reasoning settings."

  gpt_5_4_mini:
    display_name: GPT-5.4 mini
    historical_magic_peer: false
    exact_model: gpt-5.4-mini-2026-03-17
    execution: openai
    model_env: GPT54_MINI_MODEL
    api_key_env: OPENAI_API_KEY
    availability_note: "Pinned current OpenAI mini snapshot for reproducible efficiency-oriented evaluation."

  claude_sonnet_5:
    display_name: Claude Sonnet 5
    historical_magic_peer: false
    exact_model: claude-sonnet-5
    execution: anthropic_or_archived_endpoint
    model_env: CLAUDE5_MODEL
    base_url_env: CLAUDE5_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    availability_note: "Current Anthropic Sonnet model."

  mistral_small_4:
    display_name: Mistral Small 4
    historical_magic_peer: false
    exact_model: mistral-small-2603
    execution: openai_compatible
    model_env: MISTRAL_SMALL4_MODEL
    base_url_env: MISTRAL_BASE_URL
    api_key_env: MISTRAL_API_KEY
    availability_note: "Current Mistral v26.03 Chat Completions model."

  llama_3_3_70b:
    display_name: Llama 3.3 70B Instruct
    historical_magic_peer: false
    exact_model: meta-llama/Llama-3.3-70B-Instruct
    execution: openai_compatible
    model_env: LLAMA33_MODEL
    base_url_env: LLAMA33_BASE_URL
    api_key_env: LLAMA33_API_KEY
    availability_note: "Open weights; serve the frozen checkpoint through vLLM or another OpenAI-compatible endpoint."

  mixtral_8x7b:
    display_name: Mixtral 8x7B Instruct
    historical_magic_peer: true
    exact_model: open-mixtral-8x7b
    execution: openai_compatible
    model_env: MIXTRAL_MODEL
    base_url_env: MIXTRAL_BASE_URL
    api_key_env: MIXTRAL_API_KEY
    availability_note: "Retired from Mistral first-party API; use frozen weights or an endpoint serving the exact checkpoint."

  llama_3_1_70b:
    display_name: Llama 3.1 70B Instruct
    historical_magic_peer: true
    exact_model: meta-llama/Llama-3.1-70B-Instruct
    execution: openai_compatible
    model_env: LLAMA_MODEL
    base_url_env: LLAMA_BASE_URL
    api_key_env: LLAMA_API_KEY
    availability_note: "Frozen Meta weights remain reproducible through vLLM/compatible serving."

  claude_3_5_haiku:
    display_name: Claude 3.5 Haiku
    historical_magic_peer: true
    exact_model: claude-3-5-haiku-20241022
    execution: anthropic_or_archived_endpoint
    model_env: CLAUDE_MODEL
    base_url_env: CLAUDE_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
    availability_note: "Historical checkpoint; if unavailable from the selected provider, do not silently replace it."

  gpt_4o_mini:
    display_name: GPT-4o-mini
    historical_magic_peer: true
    exact_model: gpt-4o-mini-2024-07-18
    execution: openai
    model_env: GPT4O_MINI_MODEL
    api_key_env: OPENAI_API_KEY
    availability_note: "Historical peer checkpoint; record the exact accepted API model."

  o1:
    display_name: o1
    historical_magic_peer: true
    exact_model: o1-2024-12-17
    execution: openai
    model_env: O1_MODEL
    api_key_env: OPENAI_API_KEY
    availability_note: "Historical peer checkpoint; record the exact accepted API model."

reporting:
  primary_effects:
    - delta_id_rashomon_llm_vs_compute_matched_direct
    - delta_loc_rashomon_llm_vs_compute_matched_direct
    - delta_id_rashomon_deberta_vs_direct
    - delta_loc_rashomon_deberta_vs_direct
    - delta_rashomon_deberta_vs_rashomon_llm
  aggregate:
    - mean_delta_id_across_models
    - mean_delta_loc_across_models
    - models_improved_id_count
    - models_improved_loc_count
