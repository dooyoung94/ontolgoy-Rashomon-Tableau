experiment:
  dataset_family: OpenRCA2
  standard_protocol:
    topology_input: false
    dependency_source: traces_only
    gold_graph_usage: evaluation_only
  stress_test:
    mask_ratios: [0.0, 0.2, 0.4, 0.6, 0.8]
    seeds: [13, 42, 97]

ablation:
  - graph_only
  - abduction
  - abduction_deberta
  - abduction_psl
  - full

abduction:
  max_structural_hops: 2
  max_candidates: 128
  edge_threshold: 0.5

semantic:
  model: MoritzLaurer/DeBERTa-v3-base-mnli-fever-anli
  max_length: 512
  batch_size: 16

psl:
  note: cross-edge path constraints required before calling this global inference
  local_weights:
    structural: 1.0
    temporal: 1.2
    anomaly: 1.2
    semantic: 2.0
    contradiction: 2.0

metrics:
  service_normalization: lower_strip_ts_prefix_remove_separators
  filter_loadgen_edges: true
  official_process:
    - node_f1
    - edge_f1
    - process_path_reachability
  diagnostic:
    - missing_edge_precision
    - missing_edge_recall
    - missing_edge_f1
    - root_hit_at_1
    - root_hit_at_3

leakage_policy:
  causal_graph_json: evaluator_only
  injection_json: evaluator_only
  gold_alarm_nodes: evaluator_only
  no_test_threshold_tuning: true
