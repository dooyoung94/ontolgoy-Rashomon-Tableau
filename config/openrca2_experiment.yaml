experiment:
  dataset: anon-ops/ops-lite
  problem: collector_data_available_but_topology_relation_missing

  topology_reference:
    source: complete_structural_relations_from_full_available_collector_data
    evaluator_only: true
    note: OpenRCA does not provide a complete persistent topology gold file

  model_input:
    - incomplete_topology
    - collector_observations

  topology_missing_ratios: [0.2, 0.4, 0.6]
  seeds: [42]

  masking_rule:
    remove_nodes: false
    remove_collector_data: false
    remove_topology_relations_only: true
    expose_missing_marker: false

  relation_types:
    - calls
    - deployed_on
    - runs_on
    - uses_database
    - uses_messaging
    - has_service

methods:
  S0:
    code: topology_only
    description: incomplete_topology_without_recovery
  S1:
    code: abduction
    description: abduction
  S2:
    code: abduction_deberta
    description: abduction_plus_deberta
  S3:
    code: abduction_psl
    description: abduction_plus_psl
  S4:
    code: abduction_deberta_psl
    description: abduction_plus_deberta_plus_psl

recovery:
  candidate_policy: collector_observed_endpoint_pairs_only
  allow_all_node_pairs: false
  ontology_type_constraints: true
  relation_threshold: 0.5

primary_metrics:
  - missing_relation_precision
  - missing_relation_recall
  - missing_relation_f1
  - relation_type_f1

secondary_metrics:
  - full_topology_precision
  - full_topology_recall
  - full_topology_f1

next_downstream_experiment:
  compare:
    - incomplete_topology_to_rca
    - recovered_topology_to_rca
    - complete_topology_to_rca
  metrics:
    - root_cause
    - path_reachability
    - node_f1
    - edge_f1

leakage_policy:
  causal_graph_json: evaluator_only
  injection_json: evaluator_only
  gold_root: evaluator_only
  collector_observations_are_never_masked: true
  removed_topology_relations_are_never_shown_to_model: true
