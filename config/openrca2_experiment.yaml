experiment:
  dataset: anon-ops/ops-lite
  problem: collector_data_available_but_topology_relation_missing

  topology_reference:
    contract: config/reference_topology_contract.yaml
    schema_version: "1.0"
    source: external_versioned_topology_reference
    evaluator_only: true
    required: true
    world_assumption: open_world
    relation_statuses: [VERIFIED_POSITIVE, VERIFIED_NEGATIVE, UNKNOWN]
    absent_relation_status: UNKNOWN
    unknown_counts_as_false_positive: false
    required_provenance_fields:
      - source
      - version
      - independent_of_model_observations
      - evaluator_only
    prohibited_source: telemetry_observation_abduction_used_by_recovery_model
    note: OpenRCA does not provide a complete persistent topology gold file

  model_input:
    - incomplete_topology
    - collector_observations

  topology_missing_ratios: [0.2, 0.4, 0.6]
  seeds: [13, 42, 97, 123, 2026]

  masking_rule:
    remove_nodes: false
    remove_collector_data: false
    remove_topology_relations_only: true
    expose_missing_marker: false
    unit: topology_group
    group_key_priority: [topology_id, system]
    nested_within_seed: true

  relation_types:
    - calls
    - deployed_on
    - runs_on
    - uses_database
    - uses_messaging
    - has_service

methods:
  S0:
    code: topology_only
    description: incomplete_topology_without_recovery
  S1:
    code: abduction
    description: abduction
  S2:
    code: abduction_deberta
    description: abduction_plus_deberta
  S3:
    code: abduction_psl
    description: abduction_plus_psl
  S4:
    code: abduction_deberta_psl
    description: abduction_plus_deberta_plus_psl

recovery:
  candidate_policy: collector_observed_endpoint_pairs_only
  allow_all_node_pairs: false
  ontology_type_constraints: true
  relation_threshold: 0.5
  psl_visible_topology_constraints:
    functional_by_source: [runs_on]
    functional_by_target: [has_service]
    intentionally_multi_valued: [calls, deployed_on, uses_database, uses_messaging]

relation_recovery_metrics:
  primary:
    - missing_relation_precision
    - missing_relation_recall
    - missing_relation_f1
    - relation_type_f1
  secondary:
    - full_topology_precision
    - full_topology_recall
    - full_topology_f1
    - verified_prediction_coverage
    - unknown_edge_insertion_rate

openrca2_rca_evaluation:
  topology_conditions:
    - incomplete
    - recovered
    - complete
  invariant_inputs:
    - incident_evidence
    - gold_root_causes_for_evaluation_only
    - gold_causal_process_for_evaluation_only
  rca_variant_for_current_smoke: full
  rca_edge_threshold: 0.5
  metrics:
    - any_service_hit
    - all_service_hit
    - root_precision
    - root_recall
    - root_f1
    - root_exact
    - root_hit_at_1
    - root_hit_at_3
    - path_reachability
    - node_precision
    - node_recall
    - node_f1
    - edge_precision
    - edge_recall
    - edge_f1
  primary_deltas:
    - recovered_minus_incomplete_root_f1
    - recovered_minus_incomplete_path_reachability
    - recovered_minus_incomplete_node_f1
    - recovered_minus_incomplete_edge_f1
  upper_reference_gaps:
    - complete_minus_recovered_root_f1
    - complete_minus_recovered_path_reachability
    - complete_minus_recovered_node_f1
    - complete_minus_recovered_edge_f1

leakage_policy:
  causal_graph_json: evaluator_only
  injection_json: evaluator_only
  gold_root: evaluator_only
  collector_observations_are_never_masked: true
  removed_topology_relations_are_never_shown_to_model: true
  derived_reference_allowed_for_primary_results: false
  empty_missing_relation_cases_excluded_from_macro_recovery_metrics: true
  unverified_reference_absence_is_negative: false
