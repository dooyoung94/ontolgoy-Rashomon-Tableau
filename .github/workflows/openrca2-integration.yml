name: OpenRCA DeBERTa PSL Integration

on:
  push:
    paths:
      - '.github/workflows/openrca2-integration.yml'
      - 'src/openrca_mr/semantic.py'
      - 'src/openrca_mr/psl.py'
      - 'src/openrca_mr/pipeline.py'
      - 'src/openrca_mr/abduction.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install CPU inference stack
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'
      - name: Run DeBERTa and PSL end-to-end toy case
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python - <<'PY'
          from openrca_mr.models import CausalEdge, Evidence, RcaCase
          from openrca_mr.pipeline import MissingRelationRCA
          from openrca_mr.semantic import DebertaEvidenceScorer
          from openrca_mr.psl import PslGlobalInference

          case = RcaCase(
              case_id='integration-toy',
              symptom_nodes=['api'],
              known_edges=[CausalEdge('db','dependency','worker'), CausalEdge('worker','dependency','api')],
              evidence=[
                  Evidence('e1','db','metric','db latency',0.98,1.0,'Database query latency sharply increased.'),
                  Evidence('e2','worker','metric','request latency',0.92,2.0,'Worker request latency increased after database latency.'),
                  Evidence('e3','api','metric','response latency',0.97,3.0,'API response latency increased after worker latency.'),
              ],
          )
          model = MissingRelationRCA(
              semantic_scorer=DebertaEvidenceScorer(device='cpu', batch_size=8),
              global_inference=PslGlobalInference(),
              edge_threshold=0.35,
          )
          pred = model.run(case)
          print('ROOTS', pred.predicted_root_causes)
          print('EDGES', pred.predicted_edges)
          for h in pred.ranked_hypotheses[:6]:
              print(h.edge.key(), h.semantic_support, h.semantic_contradiction, h.soft_logic_score)
          assert pred.ranked_hypotheses
          assert all(h.soft_logic_score is not None for h in pred.ranked_hypotheses)
          assert 'db' in pred.predicted_root_causes
          PY
