name: Ops Lite Public Access Probe

on:
  push:
    paths:
      - '.github/workflows/ops-lite-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe direct and dataset-server endpoints
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://huggingface.co/datasets/anon-ops/ops-lite/resolve/main'
          curl -fL --retry 2 "$BASE/manifest.jsonl?download=true" -o /tmp/manifest.jsonl || true
          if [ -s /tmp/manifest.jsonl ]; then
            head -2 /tmp/manifest.jsonl
          fi
          curl -fL --retry 2 'https://datasets-server.huggingface.co/first-rows?dataset=anon-ops%2Fops-lite&config=default&split=train' -o /tmp/first.json || true
          if [ -s /tmp/first.json ]; then head -c 12000 /tmp/first.json; echo; fi
          curl -fL --retry 2 'https://datasets-server.huggingface.co/first-rows?dataset=lincyaw%2Fopenrca2-lite-v2&config=default&split=train' -o /tmp/lite.json || true
          if [ -s /tmp/lite.json ]; then head -c 12000 /tmp/lite.json; echo; fi
