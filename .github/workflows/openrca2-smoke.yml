name: OpenRCA Missing-Relation Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core and tests
        run: pip install -e '.[test]'
      - name: Run unit tests
        run: pytest -q
