name: Topology Relation Recovery

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: Number of OpenRCA cases
        required: false
        default: '20'

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install and test
        run: |
          pip install -e '.[test]'
          pytest -q

  psl_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PSL
        run: pip install -e '.[psl]'
      - name: Check one missing topology relation
        run: |
          python - <<'PY'
          from openrca_mr.models import CausalEdge, RelationObservation, REL_CALLS
          from openrca_mr.psl import PslStructuralInference
          from openrca_mr.topology_recovery import recover_missing_topology_relations

          observations = [
              RelationObservation(
                  'o1', 'service:frontend', 'service:orders',
                  'trace_parent_child', 0.98,
                  'frontend parent span has orders child span'
              )
          ]
          result = recover_missing_topology_relations(
              visible_relations=[],
              observations=observations,
              global_inference=PslStructuralInference(),
              relation_threshold=0.5,
          )
          expected = CausalEdge('service:frontend', REL_CALLS, 'service:orders')
          assert expected in result.added_relations
          print('TOPOLOGY_RELATION_RECOVERY_OK', [e.key() for e in result.added_relations])
          PY

  prepare_topology_cases:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install collector adapter
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install 'pyarrow>=16'
      - name: Build complete topology reference and collector observations
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python scripts/build_ops_lite_cases_fast.py \
            --limit '${{ inputs.limit }}' \
            --out artifacts/topology_cases.jsonl
          python - <<'PY'
          from openrca_mr.openrca2 import load_normalized_cases
          cases = load_normalized_cases('artifacts/topology_cases.jsonl')
          assert cases
          assert all(c.structural_relations for c in cases)
          assert all(c.relation_observations for c in cases)
          print('CASES', len(cases))
          print('MEAN_TOPOLOGY_RELATIONS', sum(len(c.structural_relations) for c in cases) / len(cases))
          print('MEAN_COLLECTOR_OBSERVATIONS', sum(len(c.relation_observations) for c in cases) / len(cases))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: topology-cases
          path: artifacts/topology_cases.jsonl
          retention-days: 7

  topology_recovery:
    if: github.event_name == 'workflow_dispatch'
    needs: prepare_topology_cases
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        missing_ratio: [0.2, 0.4, 0.6]
        variant:
          - topology_only
          - abduction
          - abduction_deberta
          - abduction_psl
          - abduction_deberta_psl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: topology-cases
          path: artifacts
      - name: Install recovery stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'
      - name: Recover missing topology relations
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          VARIANT: ${{ matrix.variant }}
          RATIO: ${{ matrix.missing_ratio }}
        run: |
          SAFE_RATIO=$(echo '${{ matrix.missing_ratio }}' | tr '.' '_')
          OUT="results/${{ matrix.variant }}_${SAFE_RATIO}.json"
          python scripts/run_structural_recovery.py \
            --data artifacts/topology_cases.jsonl \
            --out "$OUT" \
            --variant '${{ matrix.variant }}' \
            --topology-missing-ratio '${{ matrix.missing_ratio }}' \
            --seed 42 \
            --relation-threshold 0.5 \
            --limit '${{ inputs.limit }}'
          python - <<'PY'
          import glob, json, os
          ratio = os.environ['RATIO'].replace('.', '_')
          path = f"results/{os.environ['VARIANT']}_{ratio}.json"
          r = json.load(open(path))
          print('RESULT', r['variant'], r['topology_missing_ratio'], json.dumps(r['summary'], sort_keys=True))
          print('PER_RELATION', json.dumps(r['per_relation_type'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: topology-result-${{ matrix.variant }}-${{ matrix.missing_ratio }}
          path: results/*.json
          retention-days: 14

  aggregate:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: topology_recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: topology-result-*
          path: results
          merge-multiple: true
      - name: Build final table
        run: |
          python - <<'PY'
          import glob, json
          rows=[]
          for path in sorted(glob.glob('results/*.json')):
              r=json.load(open(path))
              s=r['summary']
              rows.append({
                  'missing_ratio': r['topology_missing_ratio'],
                  'variant': r['variant'],
                  'missing_precision': s['micro_missing_relation_precision'],
                  'missing_recall': s['micro_missing_relation_recall'],
                  'missing_f1': s['micro_missing_relation_f1'],
                  'full_topology_f1': s['micro_full_topology_f1'],
                  'mean_missing_relations': s['mean_missing_relations'],
                  'mean_added_relations': s['mean_added_relations'],
              })
          rows.sort(key=lambda x: (x['missing_ratio'], x['variant']))
          print(json.dumps(rows, indent=2))
          json.dump(rows, open('topology_results.json','w'), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: topology-recovery-summary
          path: topology_results.json
          retention-days: 14
