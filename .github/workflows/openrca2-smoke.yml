name: OpenRCA Missing-Relation Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core and tests
        run: pip install -e '.[test]'
      - name: Run unit tests
        run: pytest -q

  stage1_psl_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # pslpython 2.4 pins JPype1 1.4, which is not compatible with CPython 3.11.
          # The OpenRCA inference workflows therefore execute PSL on Python 3.10.
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Stage-1 PSL stack
        run: pip install -e '.[psl]'
      - name: Run synthetic structural PSL inference
        run: |
          python - <<'PY'
          from openrca_mr.models import CausalEdge, RelationObservation, REL_CALLS, REL_DEPLOYED_ON
          from openrca_mr.psl import PslStructuralInference
          from openrca_mr.structural import StructuralRelationRecovery

          observations = [
              RelationObservation(
                  'o1', 'service:frontend', 'service:orders',
                  'trace_parent_child', 0.98,
                  'frontend parent span has orders child span'
              ),
              RelationObservation(
                  'o2', 'service:orders', 'pod:orders-1',
                  'service_pod_cooccurrence', 0.98,
                  'orders telemetry is emitted from orders-1'
              ),
          ]
          result = StructuralRelationRecovery(
              global_inference=PslStructuralInference(),
              relation_threshold=0.50,
          ).run(observations)
          assert CausalEdge('service:frontend', REL_CALLS, 'service:orders') in result.relations
          assert CausalEdge('service:orders', REL_DEPLOYED_ON, 'pod:orders-1') in result.relations
          print('STAGE1_PSL_OK', [edge.key() for edge in result.relations])
          PY

  ops_lite_prepare:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ops-lite-20]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install adapter dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install 'pyarrow>=16'
      - name: Build leakage-safe 20-case telemetry set
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python scripts/build_ops_lite_cases_fast.py --limit 20 --out artifacts/ops_lite_20.jsonl
          python - <<'PY'
          from openrca_mr.openrca2 import load_normalized_cases
          cases=load_normalized_cases('artifacts/ops_lite_20.jsonl')
          assert len(cases) == 20, len(cases)
          assert all(c.gold_root_causes and c.gold_edges for c in cases)
          assert all(c.known_edges and c.evidence and c.symptom_nodes for c in cases)
          assert all(c.relation_observations and c.structural_relations for c in cases)
          print('PREPARED', len(cases))
          print('AVG_KNOWN_EDGES', sum(len(c.known_edges) for c in cases)/len(cases))
          print('AVG_RELATION_OBSERVATIONS', sum(len(c.relation_observations) for c in cases)/len(cases))
          print('AVG_STRUCTURAL_RELATIONS', sum(len(c.structural_relations) for c in cases)/len(cases))
          print('AVG_EVIDENCE', sum(len(c.evidence) for c in cases)/len(cases))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ops-lite-20-normalized
          path: artifacts/ops_lite_20.jsonl
          retention-days: 7

  ops_lite_benchmark:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ops-lite-20]')
    needs: ops_lite_prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [graph_only, abduction, abduction_deberta, abduction_psl, full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: ops-lite-20-normalized
          path: artifacts
      - name: Install inference stack
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e '.[all]'
      - name: Run ${{ matrix.variant }} causal relation mask
        env:
          HF_HUB_DISABLE_XET: '1'
          TOKENIZERS_PARALLELISM: 'false'
          VARIANT: ${{ matrix.variant }}
        run: |
          python scripts/run_openrca2_ablation.py \
            --data artifacts/ops_lite_20.jsonl \
            --out results/${{ matrix.variant }}.json \
            --dataset-id 'anon-ops/ops-lite:20:causal_relation_mask_v1' \
            --mask-mode relation \
            --mask-ratio 0.40 \
            --seed 42 \
            --variant '${{ matrix.variant }}' \
            --limit 20
          python - <<'PY'
          import json, os
          r=json.load(open('results/' + os.environ['VARIANT'] + '.json'))
          print('RESULT', r['variant'], json.dumps(r['summary'], sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: causal-relation-result-${{ matrix.variant }}
          path: results/${{ matrix.variant }}.json
          retention-days: 7

  ops_lite_aggregate:
    if: always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[ops-lite-20]')
    needs: ops_lite_benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: causal-relation-result-*
          path: results
          merge-multiple: true
      - name: Aggregate causal-relation-mask A0-A4
        run: |
          python - <<'PY'
          import json
          order=['graph_only','abduction','abduction_deberta','abduction_psl','full']
          rows=[]
          for v in order:
              p=f'results/{v}.json'
              try: r=json.load(open(p))
              except FileNotFoundError: continue
              s=r['summary']
              rows.append({
                  'variant':v,
                  'relation_accuracy':s.get('relation_accuracy'),
                  'relation_precision':s.get('relation_precision'),
                  'relation_recall':s.get('relation_recall'),
                  'relation_f1':s.get('relation_f1'),
                  'node_f1':s.get('node_f1'),
                  'edge_f1':s.get('edge_f1'),
                  'path_reachability':s.get('process_path_reachability'),
                  'root_hit_at_1':s.get('root_hit_at_1'),
                  'root_hit_at_3':s.get('root_hit_at_3'),
              })
          print('CAUSAL_RELATION_MASK_A0_A4_RESULTS')
          print(json.dumps(rows, indent=2))
          json.dump(rows, open('results/summary.json','w'), indent=2)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ops-lite-20-causal-relation-mask-results
          path: results
          retention-days: 14
