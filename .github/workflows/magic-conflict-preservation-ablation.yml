name: MAGIC Conflict Evidence Preservation Ablation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magic-conflict-preservation-ablation.yml'
      - 'scripts/evaluate_magic_conflict_preservation.py'

permissions:
  actions: read
  contents: read

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frozen MAGIC DeBERTa artifact
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          run-id: 32730398659
          github-token: ${{ github.token }}
          path: source_artifact

      - name: Evaluate conflict evidence preservation policies
        run: |
          python scripts/evaluate_magic_conflict_preservation.py \
            --input source_artifact/magic_deberta_worlds_metrics.json \
            --output results/magic_conflict_preservation_ablation.json

      - name: Show key comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/magic_conflict_preservation_ablation.json').read_text())
          print(json.dumps(d['protocol'], indent=2))
          for name in ['top1','top3_tog_style','top5','rashomon_add_eps_0.05','rashomon_add_eps_0.10','rashomon_relative_loss_0.25','boundary_top3_eps_0.01','boundary_top5_eps_0.01','no_pruning']:
              x=d['policies'][name]['recoverable_queries']
              print(name,
                    'survival=', x['query_gold_survival'],
                    'precision=', x['retained_gold_precision_micro'],
                    'recall=', x['retained_gold_recall_micro'],
                    'f1=', x['retained_gold_f1_micro'],
                    'avg_selected=', x['avg_selected_paths'])
          print('paths_ge_5')
          for name in ['top3_tog_style','top5','rashomon_add_eps_0.05','rashomon_add_eps_0.10','boundary_top5_eps_0.01','no_pruning']:
              x=d['cumulative_branching_strata']['paths_ge_5']['policies'][name]
              print(name,
                    'survival=', x['query_gold_survival'],
                    'precision=', x['retained_gold_precision_micro'],
                    'f1=', x['retained_gold_f1_micro'],
                    'avg_selected=', x['avg_selected_paths'])
          print(json.dumps(d['paired_tests'], indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: magic-conflict-preservation-ablation
          path: results/magic_conflict_preservation_ablation.json
          retention-days: 90
