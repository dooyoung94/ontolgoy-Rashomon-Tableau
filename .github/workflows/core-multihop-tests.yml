name: Rashomon-Tableau Core Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/rashomon_tableau/multihop_completion.py'
      - 'src/rashomon_tableau/models.py'
      - 'src/rashomon_tableau/ontology.py'
      - 'src/rashomon_tableau/tableau.py'
      - 'tests/test_multihop_completion.py'
      - '.github/workflows/core-multihop-tests.yml'
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and test dependencies
        run: |
          pip install -e .
          pip install pytest
      - name: Compile redesigned core
        run: |
          python -m py_compile \
            src/rashomon_tableau/multihop_completion.py \
            src/rashomon_tableau/ontology.py \
            src/rashomon_tableau/tableau.py
      - name: Run multi-hop completion regression tests
        run: pytest -q tests/test_multihop_completion.py
