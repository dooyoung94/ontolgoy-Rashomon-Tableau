name: OpenRCA2 Direct Download Probe

on:
  push:
    paths:
      - '.github/workflows/openrca2-direct-download.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe direct public files
        shell: bash
        run: |
          set -euxo pipefail
          BASE='https://huggingface.co/datasets/lincyaw/openrca2-v1-500/resolve/main'
          curl -fL --retry 2 "$BASE/MANIFEST.json?download=true" -o /tmp/MANIFEST.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/MANIFEST.json'))
          rows=m['cases']
          print('N_CASES',len(rows))
          print('FIRST',json.dumps(rows[0],ensure_ascii=False))
          print('FIRST_NAME',rows[0]['name'])
          open('/tmp/name','w').write(rows[0]['name'])
          PY
          NAME=$(cat /tmp/name)
          for F in injection.json causal_graph.json env.json; do
            echo "### $F"
            curl -fL --retry 2 "$BASE/$NAME/$F?download=true" -o "/tmp/$F"
            head -c 6000 "/tmp/$F" || true
            echo
          done
          echo '### parquet head'
          curl -fLI --retry 2 "$BASE/$NAME/abnormal_traces.parquet?download=true" | head -30
