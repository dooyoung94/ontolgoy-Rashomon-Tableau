name: MAGIC HF Open-LLM Pilot Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magic-hf-pilot-once.yml'
  workflow_dispatch:

jobs:
  hf-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project only
        run: |
          pip install -e .
      - name: Validate HF token is present
        shell: bash
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN repository secret is missing'; exit 1; }
      - name: Run bounded HF contract smoke test (Command A first, GPT-OSS, Qwen3)
        run: |
          python scripts/smoke_hf_contracts.py \
            --model-set hf_open_llms \
            --out results/hf_contract_smoke.json
      - name: Show bounded request policy
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('results/hf_contract_smoke.json')
          if not path.exists():
              print('Smoke result was not created.')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          print('Hard provider request cap:', data['hard_provider_request_cap'])
          print('Retries enabled:', data['retries_enabled'])
          print('Task budgets:', data.get('task_budgets'))
          for index, model in enumerate(data['models'], start=1):
              print(index, model['model_key'], model['successful_calls'], '/ 3', 'all_ok=', model['all_contracts_ok'])
          PY
      - name: Upload HF smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-hf-contract-smoke-bounded
          path: results/hf_contract_smoke.json
