name: MAGIC HF Open-LLM Pilot Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/magic-hf-pilot-once.yml'
  workflow_dispatch:

jobs:
  hf-pilot-20:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and DeBERTa dependencies
        run: |
          pip install -e .
          pip install 'transformers>=4.50,<5' 'torch>=2.2' sentencepiece
      - name: Validate HF token is present
        shell: bash
        run: |
          test -n "$HF_TOKEN" || { echo 'HF_TOKEN repository secret is missing'; exit 1; }
      - name: Run fixed-call 20-row paired HF MAGIC pilot
        run: |
          python scripts/run_magic_peer_matrix.py \
            --model-set hf_open_llms \
            --attempts 1 \
            --limit 20 \
            --no-retries \
            --cache-dir results/magic_hf_fixed20_cache \
            --out results/magic_hf_fixed20_summary.json \
            --loc-export results/magic_hf_fixed20_loc_blinded.json
      - name: Analyze paired method effects
        if: always()
        run: |
          if ls results/magic_hf_fixed20_cache/*.jsonl >/dev/null 2>&1; then
            python scripts/analyze_magic_peer_matrix.py \
              --cache-dir results/magic_hf_fixed20_cache \
              --out results/magic_hf_fixed20_paired_stats.json
          else
            echo '{"models":{},"note":"No completed fixed-call rows to analyze."}' > results/magic_hf_fixed20_paired_stats.json
          fi
      - name: Validate fixed-call budget
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('results/magic_hf_fixed20_summary.json')
          if not path.exists():
              print('Summary was not created.')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          print(json.dumps(data.get('fixed_call_policy', {}), indent=2))
          print('Models completed:', [m['model_key'] for m in data.get('models', [])])
          print('Failures:', data.get('failures', []))
          cap = data.get('fixed_call_policy', {}).get('provider_request_cap_if_no_retries')
          if cap != 300:
              raise SystemExit(f'Unexpected provider request cap: {cap}; expected 300')
          for model in data.get('models', []):
              print(model['model_key'], 'n=', model['n'], 'calls=', model['physical_provider_calls'], 'expected=', model['expected_calls_if_complete'])
          PY
      - name: Upload fixed-call 20-row pilot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magic-hf-fixed-call-pilot-20
          path: |
            results/magic_hf_fixed20_summary.json
            results/magic_hf_fixed20_paired_stats.json
            results/magic_hf_fixed20_loc_blinded.json
            results/magic_hf_fixed20_cache/*.jsonl
