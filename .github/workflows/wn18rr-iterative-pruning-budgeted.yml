name: WN18RR Iterative Pruning Budgeted

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wn18rr-iterative-pruning-budgeted.yml'
      - 'scripts/evaluate_iterative_pruning_budgeted.py'

jobs:
  budgeted:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and NLI dependencies
        run: |
          pip install -e .
          pip install -r requirements-nli.txt
      - name: Download WN18RR
        run: python scripts/download_relation_benchmarks.py --dataset WN18RR
      - name: Build deterministic 2-4 hop benchmark
        run: |
          python scripts/build_multihop_relation_benchmark.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --target-split test \
            --min-hops 2 --max-hops 4 \
            --max-examples 50 --max-paths-per-target 1 \
            --output data/kg_benchmarks/WN18RR/multihop_test.jsonl
      - name: Run budget-matched pruning 50 queries
        run: |
          python scripts/evaluate_iterative_pruning_budgeted.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --benchmark data/kg_benchmarks/WN18RR/multihop_test.jsonl \
            --limit 50 --min-hops 2 --max-hops 4 \
            --batch-size 64 --device cpu \
            --output results/wn18rr_iterative_pruning_budgeted_50.json
      - name: Show budget-matched comparison
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/wn18rr_iterative_pruning_budgeted_50.json').read_text())
          for anchor, fams in d['budget_matched'].items():
              print('\nANCHOR', anchor)
              for fam, x in fams.items():
                  print(fam, json.dumps(x, ensure_ascii=False))
          print('\nPARETO', json.dumps(d['pareto_success_vs_expansion'], ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wn18rr-iterative-pruning-budgeted-50
          path: results/wn18rr_iterative_pruning_budgeted_50.json
          retention-days: 90
