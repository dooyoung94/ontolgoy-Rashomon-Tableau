name: WN18RR Iterative Pruning Relative Loss

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wn18rr-iterative-pruning-relative-loss.yml'
      - 'scripts/evaluate_iterative_pruning_relative_loss.py'
      - 'scripts/evaluate_iterative_pruning_search_incremental.py'

jobs:
  relative-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and NLI dependencies
        run: |
          pip install -e .
          pip install -r requirements-nli.txt
      - name: Download WN18RR
        run: python scripts/download_relation_benchmarks.py --dataset WN18RR
      - name: Build deterministic 2-4 hop benchmark
        run: |
          python scripts/build_multihop_relation_benchmark.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --target-split test \
            --min-hops 2 --max-hops 4 \
            --max-examples 50 --max-paths-per-target 1 \
            --output data/kg_benchmarks/WN18RR/multihop_test.jsonl
      - name: Run relative-loss pruning 10 queries
        run: |
          python scripts/evaluate_iterative_pruning_relative_loss.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --benchmark data/kg_benchmarks/WN18RR/multihop_test.jsonl \
            --limit 10 --min-hops 2 --max-hops 4 \
            --batch-size 64 --device cpu \
            --output results/wn18rr_iterative_pruning_relative_loss_10.json
      - name: Show key policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/wn18rr_iterative_pruning_relative_loss_10.json').read_text())
          for name in ['top3_tog_style','top5','rashomon_eps_0.05','rashomon_eps_0.10','rashomon_relative_loss_0.10','rashomon_relative_loss_0.25','rashomon_relative_loss_0.50']:
              x=d['policies'][name]
              print(name, 'success=',x['search_success_rate'],'regret=',x['query_pruning_regret_rate'],'expanded=',x['avg_expanded_candidates'],'width=',x['avg_active_width'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wn18rr-iterative-pruning-relative-loss-10
          path: results/wn18rr_iterative_pruning_relative_loss_10.json
          retention-days: 90
