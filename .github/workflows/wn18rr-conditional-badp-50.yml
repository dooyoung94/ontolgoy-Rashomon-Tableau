name: WN18RR Conditional BADP 50

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate_iterative_pruning_conditional_badp.py'
      - 'scripts/evaluate_iterative_pruning_budgeted.py'
      - '.github/workflows/wn18rr-conditional-badp-50.yml'

jobs:
  conditional-badp-50:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 의존성 설치
        run: |
          pip install -e .
          pip install -r requirements-nli.txt
      - name: WN18RR 내려받기
        run: python scripts/download_relation_benchmarks.py --dataset WN18RR
      - name: 결정적 2-4홉 벤치마크 생성
        run: |
          python scripts/build_multihop_relation_benchmark.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --target-split test --min-hops 2 --max-hops 4 \
            --max-examples 50 --max-paths-per-target 1 \
            --output data/kg_benchmarks/WN18RR/multihop_test.jsonl
      - name: 조건부 BADP 50질의 실행
        run: |
          python scripts/evaluate_iterative_pruning_conditional_badp.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --benchmark data/kg_benchmarks/WN18RR/multihop_test.jsonl \
            --limit 50 --min-hops 2 --max-hops 4 \
            --batch-size 64 --device cpu \
            --output results/wn18rr_conditional_badp_50.json
      - name: 결과 artifact 업로드
        uses: actions/upload-artifact@v4
        with:
          name: wn18rr-conditional-badp-50
          path: results/wn18rr_conditional_badp_50.json
          retention-days: 90
      - name: 핵심 정책 결과 출력
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('results/wn18rr_conditional_badp_50.json').read_text())
          policies=d['policies']
          names=[
            'top3_tog_style','top5','global_eps_0.10','relative_loss_0.50',
            'boundary_top3_0.005','boundary_top5_0.010',
            'conditional_badp_top3_tau_0.005_delta_0.005',
            'conditional_badp_top3_tau_0.010_delta_0.005',
            'conditional_badp_top3_tau_0.020_delta_0.010',
            'conditional_badp_top5_tau_0.010_delta_0.010',
            'conditional_badp_top5_tau_0.020_delta_0.010',
            'conditional_badp_top5_tau_0.050_delta_0.020',
          ]
          for name in names:
              if name in policies:
                  print(name, json.dumps(policies[name], ensure_ascii=False))
          print('DIAGNOSTICS', json.dumps(d.get('conditional_badp_diagnostics', {}), ensure_ascii=False))
          print('PARETO', json.dumps(d.get('pareto_success_vs_expansion', []), ensure_ascii=False))
          PY
