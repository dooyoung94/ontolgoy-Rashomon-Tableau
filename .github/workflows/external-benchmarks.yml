name: External Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'src/rashomon_tableau/**'
      - 'scripts/**'
      - '.github/workflows/external-benchmarks.yml'
      - 'config/ontology_rules.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/rashomon_tableau/**'
      - 'scripts/**'
      - '.github/workflows/external-benchmarks.yml'
      - 'config/ontology_rules.yaml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e .

      - name: Run controlled ablations
        run: python scripts/run_ablation.py
      - name: Run official FOLIO validation fragment benchmark
        run: python scripts/evaluate_folio_fragment.py
      - name: Run official LogicNLI structured test benchmark
        run: python scripts/evaluate_logicnli.py
      - name: Run Rashomon-Tableau on DAFNA-EA Books
        run: python scripts/evaluate_truth_discovery_books.py

      - name: Clone official DAFNA-EA implementation
        run: git clone --depth 1 https://github.com/qcri/DAFNA-EA.git /tmp/DAFNA-EA
      - name: Prepare identical 100-book AuthorsNamesList subset for official DAFNA
        run: python scripts/prepare_dafna_official_books.py --dafna-root /tmp/DAFNA-EA --out-root /tmp/dafna-books-subset
      - name: Install DAFNA legacy Java-ML dependency from its vendored jar
        working-directory: /tmp/DAFNA-EA
        run: |
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file \
            -Dfile=lib/javaml-0.1.5.jar -DgroupId=net.sourceforge \
            -DartifactId=javaml -Dversion=0.1.5 -Dpackaging=jar
      - name: Build official DAFNA-EA
        working-directory: /tmp/DAFNA-EA
        run: mvn -B -DskipTests package

      - name: Run official DAFNA-EA algorithms
        shell: bash
        run: |
          set -euo pipefail
          JAR=/tmp/DAFNA-EA/target/DAFNA-EA-1.0-jar-with-dependencies.jar
          CLAIMS=/tmp/dafna-books-subset/claims
          GOLD=/tmp/dafna-books-subset/truth
          CLAIM_FILE=$CLAIMS/claim1.csv
          GOLD_FILE=$GOLD/book_golden.csv
          mkdir -p results/dafna_official /tmp/dafna-runs

          run_one() {
            alg="$1"; shift
            out="/tmp/dafna-runs/${alg}"
            mkdir -p "$out"
            java -jar "$JAR" "$alg" "$CLAIMS" "$GOLD" "$out" 0.001 0.8 1.0 0.4 "$@"
            python scripts/evaluate_dafna_official_outputs.py \
              --algorithm "$alg" --claims "$CLAIM_FILE" --gold "$GOLD_FILE" \
              --confidences "$out/Confidences.csv" --out "results/dafna_official/${alg}.json"
          }

          run_one TruthFinder 0.5 0.1
          run_one 2-Estimates 0.5
          run_one 3-Estimates 0.5 0.4
          run_one Accu 0.2 0.0 100 0.5 false true true false
          run_one AccuSim 0.2 0.0 100 0.5 true true true false
          run_one LTM 0.5 0.5 0.1 0.9 0.1 0.9 500 100 9

      - name: Build unified comparison table
        run: |
          python scripts/merge_truth_discovery_comparison.py \
            --ours results/truth_discovery_books_metrics.json \
            --official-dir results/dafna_official \
            --out-json results/dafna_official_comparison.json \
            --out-md results/dafna_official_comparison.md

      - name: Run tests
        run: |
          pip install pytest
          pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            results/ablation_metrics.json
            results/folio_fragment_metrics.json
            results/logicnli_metrics.json
            results/truth_discovery_books_metrics.json
            results/dafna_official/*.json
            results/dafna_official_comparison.json
            results/dafna_official_comparison.md
