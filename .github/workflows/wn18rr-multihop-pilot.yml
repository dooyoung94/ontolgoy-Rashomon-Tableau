name: WN18RR Multi-hop Rashomon-Tableau Pilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wn18rr-multihop-pilot.yml'

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and NLI dependencies
        run: |
          pip install -e .
          pip install -r requirements-nli.txt
      - name: Download WN18RR benchmark
        run: |
          python scripts/download_relation_benchmarks.py --dataset WN18RR
      - name: Build 2-4 hop masked-relation 50-row pilot set
        run: |
          python scripts/build_multihop_relation_benchmark.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --target-split test \
            --min-hops 2 \
            --max-hops 4 \
            --max-examples 50 \
            --max-paths-per-target 1 \
            --output data/kg_benchmarks/WN18RR/multihop_test.jsonl
      - name: Evaluate path-only vs local-subgraph Tableau
        run: |
          python scripts/evaluate_multihop_relation_completion.py \
            --dataset-dir data/kg_benchmarks/WN18RR \
            --benchmark data/kg_benchmarks/WN18RR/multihop_test.jsonl \
            --ontology config/wn18rr_ontology_rules.yaml \
            --epsilon 0.05 \
            --limit 50 \
            --batch-size 32 \
            --local-neighborhood-cap 16 \
            --device cpu \
            --output results/wn18rr_multihop_local_tableau_pilot_50.json
      - name: Show summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('results/wn18rr_multihop_local_tableau_pilot_50.json')
          d=json.loads(p.read_text())
          print(json.dumps({'protocol': d['protocol'], 'overall': d['overall'], 'by_hop': d['by_hop']}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wn18rr-multihop-local-tableau-50-pilot-cap16
          path: |
            results/wn18rr_multihop_local_tableau_pilot_50.json
            data/kg_benchmarks/WN18RR/multihop_test.jsonl
          retention-days: 90
